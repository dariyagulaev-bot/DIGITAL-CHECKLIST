# electron-builder configuration — produces ONE installer file:
#
#   dist-win/VERO-Setup.exe   (NSIS installer, per-user, no admin required)
#
# VERO is fully offline at RUNTIME. The BUILD machine needs the pinned Electron
# runtime once (already cached here). Nothing is downloaded at runtime: the
# bundled Chromium ships inside the app, and the whole UI is a single local
# file (resources/VERO.html). No CDN, no localhost, no cloud, no auto-update.

appId: com.vero.app
productName: VERO

directories:
  output: dist-win
  buildResources: build

# Only these are packed into the app (asar). No source maps, no dev files.
files:
  - main.js
  - preload.js
  - resources/**

asar: true
# Do not auto-publish anywhere. This is an air-gapped, offline distribution.
publish: null

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Display publisher. NOTE: this does NOT create a trusted digital signature —
  # Windows will still show "Unknown Publisher" until the organization signs the
  # file with its own Authenticode certificate (see IT documentation). No fake
  # or self-signed public-trust certificate is created here.
  publisherName: VERO
  # --- Code signing (left OFF — fill in only with the ORG's real certificate) -
  # certificateFile: path\\to\\org-codesign.pfx
  # certificatePassword: ${env.CSC_KEY_PASSWORD}
  # signingHashAlgorithms: [sha256]
  # rfc3161TimeStampServer: http://<org-approved-timestamp-authority>

nsis:
  oneClick: false                       # show a real installer wizard
  perMachine: false                     # per-user install → NO administrator rights
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true           # desktop shortcut with the VERO icon
  createStartMenuShortcut: true         # Start-menu shortcut with the VERO icon
  shortcutName: VERO
  installerIcon: build/icon.ico         # the Setup.exe wizard icon
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico   # icon shown in the installer header
  artifactName: VERO-Setup.exe          # exactly one file, no version suffix
  # Uninstaller stays enabled so IT can remove it cleanly.
