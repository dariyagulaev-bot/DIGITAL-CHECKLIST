<!doctype html>
<html lang="he" dir="rtl" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Rubik";
        font-weight: 700;
        src: url("assets/fonts/rubik-hebrew-700-normal.woff2") format("woff2");
        unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;
      }
      @font-face {
        font-family: "Rubik";
        font-weight: 700;
        src: url("assets/fonts/rubik-latin-700-normal.woff2") format("woff2");
      }
      :root {
        --ground: #0e1726;
        --ink: #ffffff;
        --accent: #4fd1c5;
        --font-display: "Rubik", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        font-family: var(--font-display);
      }
      #stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      #title {
        color: var(--ink);
        font-size: 120px;
        font-weight: 700;
      }
      #bar {
        width: 640px;
        height: 10px;
        border-radius: 5px;
        background: var(--accent);
        transform-origin: right center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="stack" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <h1 id="title">VERO — בדיקת התקנה</h1>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0.35, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.3);
      tl.to("#root", { opacity: 0, duration: 0.4 }, 2.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
